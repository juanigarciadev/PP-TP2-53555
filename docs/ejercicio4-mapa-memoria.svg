    <text x="795" y="649" font-size="12" fill="#222">id = 2</text>
    <text x="795" y="668" font-size="12" fill="#222">titulo = "modelo.actividades.Taller de Robótica"</text>
    <text x="795" y="687" font-size="12" fill="#222">cupoMaximo = 15</text>
    <line x1="790" y1="696" x2="1050" y2="696" stroke="#2c8a44" stroke-width="1" stroke-dasharray="3,2"/>
