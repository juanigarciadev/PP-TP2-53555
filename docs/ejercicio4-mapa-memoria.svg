    <line x1="390" y1="612" x2="650" y2="612" stroke="#2c8a44" stroke-width="1"/>
    <text x="395" y="630" font-size="10.5" font-style="italic" fill="#3a6b47">— heredado de modelo.actividades.Actividad
      —</text>
    <text x="395" y="649" font-size="12" fill="#222">id = 1</text>
    <text x="395" y="668" font-size="12" fill="#222">titulo = "Introducción a IA"</text>
    <text x="395" y="687" font-size="12" fill="#222">cupoMaximo = 30</text>
    <line x1="390" y1="696" x2="650" y2="696" stroke="#2c8a44" stroke-width="1" stroke-dasharray="3,2"/>
