<svg viewBox="0 0 1750 1280" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="diamondFilled" viewBox="0 0 16 10" refX="15" refY="5" markerWidth="15" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,5 L8,0 L16,5 L8,10 z" fill="#1a1a1a" stroke="#1a1a1a"/>
    </marker>
    <marker id="diamondOpen" viewBox="0 0 16 10" refX="15" refY="5" markerWidth="15" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,5 L8,0 L16,5 L8,10 z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/>
    </marker>
    <marker id="triangleHollow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1750" height="1280" fill="#ffffff"/>

  <text x="875" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a1a">Mapa de memoria de ejecución — método main()</text>
  <text x="875" y="58" text-anchor="middle" font-size="14" fill="#555555">Ejercicio 4 · TP1 POO — 3 estudiantes, 1
    evento, 1 sala, 2 modelo.actividades (modelo.actividades.Charla y modelo.actividades.Taller), 4 inscripciones</text>

  <!-- STACK CONTAINER -->
  <rect x="20" y="90" width="260" height="1110" rx="10" fill="#FFF9E6" stroke="#C9A227" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="150" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#8a6d00">PILA (Stack) — main()</text>

  <!-- Stack vars (LIFO: la última en apilarse queda arriba, la primera queda en la base) -->
  <text x="150" y="132" text-anchor="middle" font-size="10.5" fill="#8a6d00" font-style="italic">▲ tope (última en apilarse)</text>
  <g id="stack-sala">
    <rect x="40" y="140" width="220" height="50" rx="5" fill="#ffffff" stroke="#8a6d00" stroke-width="1.5"/>
    <text x="150" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">sala</text>
    <text x="150" y="178" text-anchor="middle" font-size="11" fill="#555">: modelo.Sala</text>
  </g>
  <g id="stack-evento">
    <rect x="40" y="210" width="220" height="50" rx="5" fill="#ffffff" stroke="#8a6d00" stroke-width="1.5"/>
    <text x="150" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">evento</text>
    <text x="150" y="248" text-anchor="middle" font-size="11" fill="#555">: modelo.EventoUniversitario</text>
  </g>
  <g id="stack-e3">
    <rect x="40" y="280" width="220" height="50" rx="5" fill="#ffffff" stroke="#8a6d00" stroke-width="1.5"/>
    <text x="150" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">estudiante3</text>
    <text x="150" y="318" text-anchor="middle" font-size="11" fill="#555">: modelo.Estudiante</text>
  </g>
  <g id="stack-e2">
    <rect x="40" y="350" width="220" height="50" rx="5" fill="#ffffff" stroke="#8a6d00" stroke-width="1.5"/>
    <text x="150" y="370" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">estudiante2</text>
    <text x="150" y="388" text-anchor="middle" font-size="11" fill="#555">: modelo.Estudiante</text>
  </g>
  <g id="stack-e1">
    <rect x="40" y="420" width="220" height="50" rx="5" fill="#ffffff" stroke="#8a6d00" stroke-width="1.5"/>
    <text x="150" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">estudiante1</text>
    <text x="150" y="458" text-anchor="middle" font-size="11" fill="#555">: modelo.Estudiante</text>
  </g>
  <text x="150" y="486" text-anchor="middle" font-size="10.5" fill="#8a6d00" font-style="italic">▼ base (primera en apilarse)</text>

  <!-- HEAP CONTAINER -->
  <rect x="310" y="90" width="1420" height="1110" rx="10" fill="#EEF5FC" stroke="#4472C4" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="1020" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#2b4f8f">HEAP (memoria dinámica)</text>

  <!-- Legend -->
  <g id="legend">
    <rect x="1370" y="140" width="330" height="150" rx="8" fill="#ffffff" stroke="#888888" stroke-width="1.3"/>
    <text x="1385" y="162" font-size="13" font-weight="700" fill="#1a1a1a">Referencias</text>
    <line x1="1385" y1="180" x2="1430" y2="180" stroke="#1a1a1a" stroke-width="1.6" marker-start="url(#diamondFilled)"/>
    <text x="1440" y="184" font-size="12" fill="#333">Composición</text>
    <line x1="1385" y1="203" x2="1430" y2="203" stroke="#1a1a1a" stroke-width="1.6" marker-start="url(#diamondOpen)"/>
    <text x="1440" y="207" font-size="12" fill="#333">Agregación</text>
    <line x1="1385" y1="226" x2="1430" y2="226" stroke="#333333" stroke-width="1.6"/>
    <text x="1440" y="230" font-size="12" fill="#333">Asociación / referencia</text>
    <line x1="1385" y1="249" x2="1430" y2="249" stroke="#8e44ad" stroke-width="1.6"/>
    <text x="1440" y="253" font-size="12" fill="#333">modelo.Inscripcion — modelo.Estudiante</text>
    <line x1="1385" y1="272" x2="1430" y2="272" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#triangleHollow)"/>
    <text x="1440" y="276" font-size="12" fill="#333">Herencia</text>
  </g>

  <!-- modelo.EventoUniversitario -->
  <g id="evento-obj">
    <rect x="520" y="140" width="340" height="190" rx="6" fill="#DDEBFF" stroke="#2b4f8f" stroke-width="2"/>
    <text x="690" y="163" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">modelo.EventoUniversitario</text>
    <line x1="530" y1="172" x2="850" y2="172" stroke="#2b4f8f" stroke-width="1"/>
    <text x="535" y="192" font-size="12" fill="#222">Id = "EVT-001"</text>
    <text x="535" y="211" font-size="12" fill="#222">titulo = "Semana de la Ingeniería"</text>
    <text x="535" y="230" font-size="12" fill="#222">costoBase = 1000.0</text>
    <text x="535" y="249" font-size="12" fill="#222">gratuito = false</text>
    <text x="535" y="268" font-size="12" fill="#222">sala ───────────</text>
    <text x="535" y="287" font-size="12" fill="#222">modelo.actividades ────</text>
    <text x="535" y="306" font-size="11" fill="#777" font-style="italic">(List&lt;modelo.actividades.Actividad&gt;)</text>
  </g>

  <!-- modelo.Sala -->
  <g id="sala-obj">
    <rect x="960" y="160" width="220" height="110" rx="6" fill="#FFE9CC" stroke="#B06A00" stroke-width="2"/>
    <text x="1070" y="183" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">modelo.Sala</text>
    <line x1="970" y1="192" x2="1170" y2="192" stroke="#B06A00" stroke-width="1"/>
    <text x="978" y="213" font-size="12" fill="#222">id = 1</text>
    <text x="978" y="234" font-size="12" fill="#222">nombre = "Auditorio Principal"</text>
  </g>
  <!-- aggregation evento -> sala -->
  <path d="M860,268 L960,215" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-start="url(#diamondOpen)"/>

  <!-- ArrayList<modelo.actividades.Actividad> -->
  <g id="modelo.actividades-list">
    <rect x="600" y="385" width="220" height="60" rx="6" fill="#F3F3F3" stroke="#555555" stroke-width="1.6" stroke-dasharray="3,2"/>
    <text x="710" y="408" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">ArrayList&lt;modelo.actividades.Actividad&gt;</text>
    <text x="710" y="425" text-anchor="middle" font-size="11" fill="#555">(modelo.actividades)</text>
  </g>
  <!-- composition evento -> modelo.actividades list -->
  <path d="M690,330 L710,385" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-start="url(#diamondFilled)"/>

  <!-- modelo.actividades.Actividad abstract -->
  <g id="actividad-abstract">
