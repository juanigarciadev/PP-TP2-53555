    <text x="1045" y="991" font-size="11.5" fill="#222">estudiante ───────</text>
  </g>

  <!-- list -> inscripcion refs -->
  <path d="M490,870 L445,910" fill="none" stroke="#333333" stroke-width="1.3"/>
  <path d="M550,870 L665,910" fill="none" stroke="#333333" stroke-width="1.3"/>
  <path d="M890,870 L915,910" fill="none" stroke="#333333" stroke-width="1.3"/>
  <path d="M950,870 L1135,910" fill="none" stroke="#333333" stroke-width="1.3"/>

