    <line x1="820" y1="939" x2="1010" y2="939" stroke="#B06A00" stroke-width="1"/>
    <text x="825" y="957" font-size="11.5" fill="#222">fecha = 2026-08-23</text>
    <text x="825" y="974" font-size="11.5" fill="#222">estado = "Confirmada"</text>
