    <text x="795" y="754" font-size="12" fill="#222">inscripciones ────</text>
    <text x="795" y="772" font-size="11" fill="#777" font-style="italic">(List&lt;modelo.Inscripcion&gt;)</text>
  </g>
  <!-- inheritance taller -> actividad -->
  <path d="M900,580 C880,555 820,540 760,528" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#triangleHollow)"/>
