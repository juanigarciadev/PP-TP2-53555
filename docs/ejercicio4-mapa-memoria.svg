    <text x="365" y="1138" font-size="12" fill="#222">nombre = "Ana Pérez"</text>
  </g>
  <g id="est2">
    <rect x="650" y="1070" width="220" height="90" rx="6" fill="#E3E0FF" stroke="#4a2fa0" stroke-width="2"/>
    <text x="760" y="1093" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">modelo.Estudiante</text>
