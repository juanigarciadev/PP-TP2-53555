    <text x="920" y="841" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">ArrayList&lt;modelo.Inscripcion&gt;</text>
    <text x="920" y="858" text-anchor="middle" font-size="11" fill="#555">(inscripciones de modelo.actividades.Taller)</text>
  </g>
  <path d="M920,780 L920,820" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-start="url(#diamondFilled)"/>

  <!-- modelo.Inscripcion objects -->
  <g id="insc-c1">
